[package]
name = "macctrl"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Map Mac Command key to Ctrl with terminal-aware handling"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
evdev = "0.13"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tray-icon = "0.15"
gtk = "0.18"
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "umgsai <umgsai@users.noreply.github.com>"
copyright = "2026, umgsai"
depends = "$auto, libx11-6, libgtk-3-0, libayatana-appindicator3-1"
section = "utility"
priority = "optional"
extended-description = """\
Map Mac Command key to Ctrl with terminal-aware handling.

When running under X11, Super (Command) key combinations are remapped to the
equivalent Ctrl combinations, while recognized terminal windows receive the
original Super chord (or a terminal-safe Ctrl+Shift alternative) so that
Ctrl+C does not kill the shell."""
assets = [
    ["target/release/macctrl", "usr/bin/macctrl", "755"],
    ["packaging/macctrl.service", "lib/systemd/user/macctrl.service", "644"],
    ["packaging/macctrl.desktop", "usr/share/applications/macctrl.desktop", "644"],
    ["packaging/99-uinput.rules", "lib/udev/rules.d/99-uinput.rules", "644"],
    ["packaging/icons/macctrl.png", "usr/share/icons/hicolor/32x32/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-16.png", "usr/share/icons/hicolor/16x16/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-22.png", "usr/share/icons/hicolor/22x22/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-24.png", "usr/share/icons/hicolor/24x24/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-48.png", "usr/share/icons/hicolor/48x48/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-64.png", "usr/share/icons/hicolor/64x64/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-128.png", "usr/share/icons/hicolor/128x128/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl-256.png", "usr/share/icons/hicolor/256x256/apps/macctrl.png", "644"],
    ["packaging/icons/macctrl.svg", "usr/share/icons/hicolor/scalable/apps/macctrl.svg", "644"],
    ["config/config.toml", "etc/macctrl/config.toml", "644"],
]
